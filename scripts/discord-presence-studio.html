    <meta charset="UTF-8" />

    <title>Vibe Studio</title>
    <link rel="icon" href="data:," />

  <body class="nodev">
    <!-- Custom frameless window chrome (Electron only; hidden in browsers).
         No logo bar — just a slim drag strip with modern window controls. -->
    <div class="vs-titlebar" id="windowTitlebar" hidden>
      <div class="vs-titlebar-drag" id="windowDragRegion" aria-hidden="true"></div>
      <div class="vs-titlebar-controls" role="group" aria-label="ตัวควบคุมหน้าต่าง">
        <button type="button" class="vs-winbtn" id="winMinimize" aria-label="ย่อหน้าต่าง"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 6h8"/></svg></button>
        <button type="button" class="vs-winbtn" id="winMaximize" aria-label="ขยายหน้าต่าง"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
        <button type="button" class="vs-winbtn vs-winbtn-close" id="winClose" aria-label="ปิดหน้าต่าง"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
      </div>
    </div>
    <script>
      // Pre-apply theme before first paint (persisted choice, else OS preference).
      try {
        var __th = localStorage.getItem('vibe.theme');
        if (!__th) __th = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.dataset.theme = __th;
      } catch (e) {}
    </script>
    <a class="skip-link" href="#main">ข้ามไปยังเนื้อหา</a>

    <div class="vs-update-banner" id="updateBanner" role="status" hidden>
      <span class="vs-update-dot" aria-hidden="true"></span>
      <p><span id="updateBannerCopy">มีเวอร์ชันใหม่ของ Vibe Studio แล้ว</span> <span id="updateBannerVersion"></span></p>
      <div class="vs-update-actions">
        <button class="vs-btn vs-btn-sm vs-btn-primary" id="updateActionButton" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg><span id="updateActionLabel">ดาวน์โหลดอัปเดต</span></button>
        <button class="vs-icon-btn vs-update-dismiss" id="updateDismissButton" type="button" aria-label="ปิดแบนเนอร์">✕</button>
      </div>
    </div>

    <div id="root"></div>
    <div id="layer"></div>
    <div id="layer2"></div>
    <script>
/* Vibe Studio renderer. Vanilla JS, no build. Talks only to the local Studio server API:
   GET /api/state /api/config /api/apps /api/installed-apps /api/settings /api/gifs/search
   PUT /api/config /api/app-mappings /api/settings   POST|DELETE /api/override /api/presence   POST /api/schedule
   Keyed DOM updates (morph) keep focus, scroll and running transitions; no innerHTML swaps of shells or modals. */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const A_ = '/art/apps/';
const H_ = '/art/hinata/';

/* ---------- catalogs and constants ---------- */
const APPS = [];       /* running apps, foreground first */
const INSTALLED = [];  /* installed apps that are not running */
const SYSTEM = [];     /* kept for the picker's "system entries" toggle (empty: the server already filters) */
const ART = [['builtin:hinata-poster', 'poster.png'], ['builtin:hinata-chill-poster', 'chill-poster.png'], ['builtin:hinata-gaming-poster', 'gaming-poster.png'], ['builtin:hinata-idle', 'idle.gif'], ['builtin:hinata-chill', 'chill.gif'], ['builtin:hinata-gaming', 'gaming.gif']];
const ARTMAP = Object.fromEntries(ART);
const TYPES = [['playing', 'Playing', 'กำลังเล่น'], ['listening', 'Listening', 'กำลังฟัง'], ['watching', 'Watching', 'กำลังดู'], ['competing', 'Competing', 'กำลังแข่ง']];
const BUNDLED_ICON = [[/roblox/i, 'roblox.svg'], [/spotify/i, 'spotify.svg'], [/discord/i, 'discord.svg'], [/chrome|firefox|msedge|brave|opera/i, 'browser.svg'], [/codex|code\.exe|zed\.exe|devenv/i, 'code.svg'], [/steam|epic|game/i, 'game.svg']];
const appKey = path => String(path || '').trim().replaceAll('/', '\\').toLowerCase()
  .replace(/(\\windowsapps\\openai\.codex_)\d+\.\d+\.\d+\.\d+(_[^\\]+\\app\\chatgpt\.exe)$/, '$1version$2');
const exeName = path => String(path || '').split(/[\\/]/).pop() || String(path || '');
const newId = prefix => prefix + '-' + (globalThis.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 12) : Date.now().toString(36) + Math.random().toString(36).slice(2, 6));

/* ---------- identity and server state ---------- */
const DCID = { name: '', handle: '', id: '', avatarUrl: '' };
/* ST holds what the server told us. ready flips once config + state arrived. */
const ST = { ready: false, error: '', rt: null, config: null, presence: null, appsLoading: false, appsError: '', appsAt: 0, hidden: [], busy: false, setup: null, polling: false };
let stPollT = null;
const mkScene = o => Object.assign({ enabled: true, name: '', type: 'playing', actName: 'Vibe Presence', l1: '', l1url: '', l2: '', l2url: '', art: '', artText: '', artUrl: '', small: '', smallText: '', smallUrl: '', btns: [{ label: '', url: '' }, { label: '', url: '' }] }, o);
const S = {
  lang: 'th', theme: 'light', screen: 'now', pairQuery: '',
  scenes: [], rules: [], drawer: null, picker: null, ov: null, save: 'saved', saveAt: '', saveMsg: '',
  saveTimer: null, fresh: null, lastFocus: null, pinApp: '', iconUp: {}, keyDraft: { discord: '', giphy: '' }, keyMsg: '',
};
try { S.lang = localStorage.getItem('vibe.lang') || 'th'; } catch (e) { /* storage unavailable */ }
try { S.theme = localStorage.getItem('vibe.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { /* storage unavailable */ }
const T = (en, th) => (S.lang === 'th' ? th : en);
const sceneBy = id => S.scenes.find(s => s.id === id);
const known = () => [...APPS, ...INSTALLED, ...SYSTEM];
const appBy = id => known().find(a => a.id === id) || (() => { const m = S.rules.find(r => r.app === id) || S.hidden.find(r => appKey(r.executable) === id); const exe = m && (m.exe || m.executable) || id; return { id, name: (m && m.name) || exeName(exe).replace(/\.exe$/i, ''), exe, g: exeName(exe).slice(0, 2).toUpperCase(), saved: true }; })();
const enabledOn = () => !(ST.rt && ST.rt.scheduleEnabled === false);
const pinnedSceneId = () => (ST.rt && ST.rt.manualOverride && ST.rt.manualOverride.sceneId) || '';
const connected = () => !!(ST.rt && ST.rt.connected);
const hasDiscordUser = () => !!DCID.id;
const idOn = () => connected() && hasDiscordUser();
const idAv = (on, sz) => on && DCID.avatarUrl ? `<img class="mk-av ${sz || ''}" src="${esc(DCID.avatarUrl)}" referrerpolicy="no-referrer" alt="">` : `<span class="mk-av mk-av-off ${sz || ''}" aria-hidden="true"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="currentColor"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span>`;
const GEAR = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="4.2"/><circle cx="10" cy="10" r="1.1" fill="currentColor" stroke="none"/><path d="M16.2 10h1.6M10 16.2v1.6M3.8 10H2.2M10 3.8V2.2M14.4 14.4l1.1 1.1M5.6 14.4l-1.1 1.1M5.6 5.6L4.5 4.5M14.4 5.6l1.1-1.1"/></svg>';

/* ---------- images ---------- */
const isHttps = v => /^https:\/\//i.test(v || '');
function appIconSrc(a) {
  if (!a) return A_ + 'app.svg';
  if (a.icon) return a.icon;
  const hit = BUNDLED_ICON.find(x => x[0].test(a.exe || ''));
  return A_ + (hit ? hit[1] : 'app.svg');
}
const icoOf = (a, lg) => a.icon || BUNDLED_ICON.some(x => x[0].test(a.exe || ''))
  ? `<img class="mk-ico ${lg ? 'mk-ico-lg' : ''}" src="${esc(appIconSrc(a))}" alt="">`
  : `<span class="mk-ico-fb ${lg ? 'mk-ico-lg' : ''}" aria-hidden="true">${esc(a.g || String(a.name || '?').slice(0, 2).toUpperCase())}</span>`;
/* What the studio can draw for a stored image reference. Discord shows https images and bundled art; anything else is a default tile. */
function imgSrc(v) {
  if (!v) return A_ + 'app.svg';
  if (ARTMAP[v]) return H_ + ARTMAP[v];
  if (isHttps(v)) return v;
  return A_ + 'app.svg';
}
const artSrc = imgSrc;

const BRAND_MARK = "<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><defs><mask id=\"vs-ghost-mask\"><rect width=\"64\" height=\"64\" fill=\"#fff\"/><circle cx=\"23.4\" cy=\"28.8\" r=\"3.4\" fill=\"#000\"/><g fill=\"none\" stroke=\"#000\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M34.2 29.6Q37.4 25 40.8 29.2\"/><path d=\"M27 33Q30.6 38 34.2 33\"/></g></mask></defs><path d=\"M32.5 11.2C22 11 15.5 19 13.8 31C12.5 40 12.8 47 15 51.5C16 53 17.5 52.5 19 51.5L22 47.7C22.8 46.8 23.8 47 24.5 47.8L27 51C27.8 52 28.8 53.5 29.2 53.5C30 53.5 31 52 32 51L33 49.5C33.8 48.8 34.5 48.8 35.2 49.5C37 51 38.8 52 41 52L43 49C44 47.5 44.8 46.5 45.8 46.8C48 47.3 50 47.7 52 47.2C54 46.7 54.5 45.5 53.5 43.5C51 38.5 48.5 36 48 31C47 21 41 11.3 32.5 11.2Z\" fill=\"currentColor\" mask=\"url(#vs-ghost-mask)\" transform=\"translate(32 32) scale(1.12) translate(-32.5 -32)\"/></svg>";

const sv = (d, w = 14) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  pin: sv('<path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/>'),
  hide: sv('<path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.2 3.9M6.6 7.6A17 17 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 4-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'), x: sv('<path d="M6 6l12 12M18 6L6 18"/>'), edit: sv('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', 16), play: sv('<path d="M7 4l13 8-13 8z"/>'), globe: sv('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', 16),
  folder: sv('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'), lock: sv('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  up: sv('<path d="M12 20V8M6 13l6-6 6 6M4 4h16"/>'), down: sv('<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>'),
  moon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};
const NAV_ICO = {
  now: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 10h4.2l1.7-4 2.4 8 1.7-4h5"/></svg>',
  scenes: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.8l7.2 4.2L10 11.2 2.8 7 10 2.8Z"/><path d="M4.3 12.3L10 15.6l5.7-3.3"/></svg>',
  settings: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="4.2"/><circle cx="10" cy="10" r="1.1" fill="currentColor" stroke="none"/><path d="M16.2 10h1.6M10 16.2v1.6M3.8 10H2.2M10 3.8V2.2M14.4 14.4l1.1 1.1M5.6 14.4l-1.1 1.1M5.6 5.6L4.5 4.5M14.4 5.6l1.1-1.1"/></svg>',
};
const pageHead = (kicker, title, sub) => `<div class="vs-page-head"><span class="vs-kicker">${kicker}</span><h1 class="vs-title">${title}</h1>${sub ? `<p class="vs-subcopy">${sub}</p>` : ''}</div>`;
const sw = (id, label, hint, on) => `<div class="vs-row"><div class="vs-row-copy"><strong>${label}</strong><small>${hint}</small></div><label class="vs-switch"><input type="checkbox" id="${id}" data-bind="tgl" data-id="${id}" aria-label="${esc(label)}" ${on ? 'checked' : ''}><span></span></label></div>`;
const langSeg = () => `<div class="vs-seg" role="group" aria-label="Language / ภาษา"><button type="button" data-act="lang" data-arg="th" aria-pressed="${S.lang === 'th'}">TH</button><button type="button" data-act="lang" data-arg="en" aria-pressed="${S.lang === 'en'}">EN</button></div>`;
const themeBtn = () => `<button type="button" class="vs-icon-btn" data-act="theme" data-arg="${S.theme === 'dark' ? 'light' : 'dark'}" aria-label="${T('Switch light / dark theme', 'สลับธีมสว่าง/มืด')}">${S.theme === 'dark' ? I.sun : I.moon}</button>`;
const cluster = () => `<div class="vs-toggle-cluster">${langSeg()}${themeBtn()}</div>`;


/* ---------- derived state ---------- */
function sceneApp(sc) {
  if (!sc) return null;
  const paired = S.rules.filter(r => r.scene === sc.id);
  const rule = paired.find(r => r.app === S.pinApp) || paired.find(r => ST.rt && ST.rt.selectedApplication && appBy(r.app).name === ST.rt.selectedApplication)
    || paired.find(r => APPS.some(a => a.id === r.app)) || paired[0];
  return rule ? appBy(rule.app) : null;
}
/* The scene exactly as Discord will receive it. The server renames the activity after the paired app and adds that app's public
   icon as the small image only when an app (not a pin) selected the Scene; local-only icons are never uploaded. */
function published(sc) {
  if (!sc) return null;
  const out = Object.assign({}, sc), app = sceneApp(sc), rt = ST.rt || {};
  const viaApp = rt.currentSceneId === sc.id ? rt.selectionSource === 'app' : app && pinnedSceneId() !== sc.id;
  if (app && viaApp) {
    out.actName = app.name;
    if (rt.currentSceneId === sc.id && rt.applicationBadge) { out.small = rt.applicationBadge; out.smallText = app.name; out.smallUrl = ''; }
  }
  return out;
}
const loading = () => !ST.ready && !ST.error;
const sk = (cls, st = '') => `<span class="mk-sk ${cls}" style="${st}" aria-hidden="true"></span>`;
const skBusy = (label, body, cls = '') => `<div class="mk-skwrap ${cls}" role="status" aria-busy="true" aria-label="${esc(label)}">${body}</div>`;
const skRows = n => Array.from({ length: n }, () => `<div class="mk-sk-row">${sk('mk-sk-ico')}<span class="mk-sk-lines">${sk('mk-sk-l1')}${sk('mk-sk-l2')}</span>${sk('mk-sk-tog')}</div>`).join('');
const skCard = rows => `<section class="vs-card">${sk('mk-sk-h')}${skRows(rows)}</section>`;

/* Discord Desktop replicas: real identity, the scene text exactly as published. */
function dcCard(sc, o = {}) {
  const on = idOn(), list = o.view === 'list';
  const name = on ? DCID.name : T('Discord user', 'ผู้ใช้ Discord'), handle = on ? DCID.handle : T('Not connected', 'ยังไม่เชื่อมต่อ');
  const dim = o.ghost ? 'opacity:.6' : '';
  const dot = `<span class="dcp-dot ${on ? '' : 'off'}" aria-hidden="true"></span>`;
  if (!sc) {
    const none = esc(o.sub || T('Nothing is shown on your profile.', 'ไม่มีอะไรแสดงบนโปรไฟล์ของคุณ'));
    if (list) return `<div class="dcp dcp-list" style="${dim}" role="img" aria-label="${esc(name)}"><div class="dcp-mlh">${T('ONLINE — 1', 'ออนไลน์ — 1')}</div><div class="dcp-mrow"><span class="dcp-mav">${idAv(on)}${dot}</span><span class="dcp-mt"><b>${esc(name)}</b></span></div></div>`;
    return `<div class="dcp" style="${dim}" role="img" aria-label="${esc(name + '. ' + none)}"><div class="dcp-top"><div class="dcp-banner"></div><div class="dcp-av">${idAv(on)}${dot}</div></div><div class="dcp-id"><b>${esc(name)}</b><span>${esc(handle)}</span></div><div class="dcp-hr"></div><div class="dcp-none"><b>${esc(o.title || T('No activity', 'ไม่มีกิจกรรม'))}</b><span>${none}</span></div></div>`;
  }
  const lbl = { playing: T('Playing', 'กำลังเล่น'), listening: T('Listening to', 'กำลังฟัง'), watching: T('Watching', 'กำลังดู'), competing: T('Competing in', 'กำลังแข่งใน') }[sc.type] || T('Playing', 'กำลังเล่น');
  const l1 = sc.l1, l2 = sc.l2, an = sc.actName || 'Vibe Presence';
  if (list) return `<div class="dcp dcp-list" style="${dim}" role="img" aria-label="${esc(name + ', ' + lbl + ' ' + an)}"><div class="dcp-mlh">${T('ONLINE — 1', 'ออนไลน์ — 1')}</div><div class="dcp-mrow"><span class="dcp-mav">${idAv(on)}${dot}</span><span class="dcp-mt"><b>${esc(name)}</b><small data-pv="act">${lbl} <b>${esc(an)}</b></small></span></div></div>`;
  const b = sc.btns.map((x, i) => [x, i]).filter(x => x[0].label);
  const lk = (cls, area, txt, url) => `<span class="${cls} ${url ? 'dcp-link' : ''}" data-pv="${area}">${esc(txt)}</span>`;
  return `<div class="dcp" style="${dim}" role="img" aria-label="${esc(name + ', ' + lbl + ' ' + an + '. ' + l1 + '. ' + l2)}">
    <div class="dcp-top"><div class="dcp-banner"></div><div class="dcp-av">${idAv(on)}${dot}</div></div>
    <div class="dcp-id"><b>${esc(name)}</b><span>${esc(handle)}</span></div><div class="dcp-hr"></div>
    <div class="dcp-act"><div class="dcp-lbl" data-pv="act">${lbl}</div>
     <div class="dcp-row"><div class="dcp-img" data-pv="large" ${sc.artText ? `data-tip="${esc(sc.artText)}"` : ''}>${sc.art ? `<img src="${esc(artSrc(sc.art))}" alt="">` : ''}${sc.small ? `<span class="dcp-sm" data-pv="small" ${sc.smallText ? `data-tip="${esc(sc.smallText)}"` : ''}><img src="${esc(artSrc(sc.small))}" alt=""></span>` : ''}</div>
      <div class="dcp-tx"><b class="dcp-name" data-pv="act">${esc(an)}</b>${lk('dcp-l', 'details', l1 || '—', sc.l1url)}${lk('dcp-l', 'state', l2 || ' ', sc.l2url)}</div></div>
     ${b.length ? `<div class="dcp-btns">${b.map(x => `<span class="dcp-btn" data-pv="btn${x[1]}">${esc(x[0].label)}</span>`).join('')}</div>` : ''}</div></div>`;
}
const dcWrap = (sc, o = {}) => `<div class="mk-pvpair">${dcCard(sc, Object.assign({}, o, { view: 'popout' }))}${dcCard(sc, Object.assign({}, o, { view: 'list' }))}</div>`;

/* ---------- Now ---------- */
/* One Show-on-Discord switch, one reason line, and what Discord acknowledged. The preview is the server's live scene, never a guess. */
function nowView() {
  const skel = loading(), rt = ST.rt || {};
  const enabled = enabledOn(), pinned = pinnedSceneId();
  const link = (act, arg, txt) => `<button type="button" class="vs-quiet-link" data-act="${act}" ${arg ? `data-arg="${arg}"` : ''}>${txt}</button>`;
  const liveScene = rt.active && ST.presence ? sceneToUi(ST.presence) : null;
  const shown = liveScene ? published(liveScene) : null;
  const app = rt.selectedApplication && S.rules.length ? known().find(a => a.name === rt.selectedApplication) || S.rules.map(r => appBy(r.app)).find(a => a.name === rt.selectedApplication) : null;
  let reason;
  if (ST.error) reason = `<span class="field-error" role="alert">${esc(ST.error)}</span> ${link('retryload', '', T('Try again', 'ลองอีกครั้ง'))}`;
  else if (rt.setup && rt.setup.needsDiscordApplicationId) reason = `${T('Add your Discord Application ID to start', 'ใส่ Discord Application ID เพื่อเริ่มใช้งาน')} · ${link('gotokeys', '', T('Open Settings', 'เปิดตั้งค่า'))}`;

function pairedPanel() {
  const rules = S.rules, query = S.pairQuery.trim().toLocaleLowerCase(), pinned = pinnedSceneId(), rt = ST.rt || {};

  const firstOf = id => (rules.find(x => x.scene === id) || {}).id;
  const tiles = visible.map(r => {
    const a = appBy(r.app), sc = sceneBy(r.scene); if (!sc) return '';
    const run = APPS.some(x => x.id === a.id);
    const isPinned = pinned === r.scene && (S.pinApp ? S.pinApp === r.app : firstOf(r.scene) === r.id);
    const active = pinned ? isPinned : rt.selectionSource === 'app' && rt.selectedApplication === a.name;
    const pinLabel = isPinned ? T('Unpin', 'เลิกปักหมุด') : T('Pin', 'ปักหมุด');

  }).join('');
  return `<section class="vs-card mk-paired" aria-labelledby="pph"><div class="mk-phead"><h2 id="pph">${T('Paired apps', 'แอปที่จับคู่')} <span class="mk-pair-count">${rules.length}</span></h2><div class="mk-phead-act"><button class="vs-btn vs-btn-sm" data-act="realadd" ${!S.scenes.length ? 'disabled' : ''}>${I.plus}${T('Add app', 'เพิ่มแอป')}</button><button class="vs-btn vs-btn-sm" data-act="refreshapps" ${ST.appsLoading ? 'disabled' : ''}>${T('Refresh', 'อ่านใหม่')}</button></div></div>
    <div class="mk-keeprow"><span class="vs-hint">${T('Pin an app to keep its Scene showing', 'ปักหมุดแอปเพื่อแสดง Scene ของแอปนั้นค้างไว้')}</span><span class="mk-keepstat" role="status">${ST.appsLoading ? T('Reading apps from this PC…', 'กำลังอ่านแอปจากเครื่อง…') : ST.appsError ? T('Apps could not be loaded', 'อ่านแอปไม่ได้') : T(`${APPS.length} running · ${INSTALLED.length} available`, `กำลังเปิด ${APPS.length} แอป · เลือกได้ ${INSTALLED.length} แอป`)}</span></div>

const FADE = new Set(['screen', 'askquit', 'quit']);

document.addEventListener('mouseover', e => { const h = e.target.closest && e.target.closest('.mk-help'); if (h && tipFor !== h) showTip(h); });
