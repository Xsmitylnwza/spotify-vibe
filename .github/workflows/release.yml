name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag and lockfile versions
        run: node electron/release-version.mjs

      - run: npm ci

      - run: npm test

      - run: npm run dist:win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Vibe-Studio-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
